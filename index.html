<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page reach the screen edges — and is what
         makes env(safe-area-inset-*) report anything at all. Without it those
         values are 0, so the insets already used in index.css were silently
         doing nothing. Anything at an edge must now pad for them itself. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Smart Vocables</title>
    <meta name="theme-color" content="#f1e8d8" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Fonts are self-hosted via @fontsource (imported in main.tsx) for offline use. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
